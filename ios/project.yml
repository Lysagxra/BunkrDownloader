name: BunkrMobile
options:
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  BunkrMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - ../macos/Sources/LinkParser.swift
    dependencies:
      - target: BunkrShare
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.bunkrdownloader.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Bunkr
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
  BunkrShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - ../macos/Sources/LinkParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bunkrdownloader.mobile.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  TransferTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/TransferService.swift
      - Sources/MobileQueue.swift
      - ../macos/Sources/LinkParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bunkrdownloader.transfer-tests
schemes:
  BunkrMobile:
    build:
      targets:
        BunkrMobile: all
  TransferTests:
    build:
      targets:
        TransferTests: all
    test:
      targets:
        - TransferTests
